# TB371FC Kernel Build with SukiSU-Ultra + EROFS + Android 16 Support
# Based on lss4/android_kernel_lenovo_paladin
# Target: Lenovo TB371FC / TB-Q706F / SM8250 (Snapdragon 870)
# Compatible: ColorOS 15, HyperOS 3, Android 16
#
# 优化说明 (vs 旧版):
#   1. 仓库内的 tb371fc_defconfig 现在作为唯一配置源 (旧版每次用 kona-perf + 内联块覆盖,
#      导致提交的 defconfig 是"死代码")。
#   2. 固定 clang-14 工具链版本, 构建更稳定可复现。
#   3. 引入 ccache + GitHub Actions 缓存, 重复构建显著加速。
#   4. 增加 concurrency 防止重复运行互相覆盖。
#   5. 构建成功后自动创建 GitHub Release (打标签 + 变更说明), 实现"发布"。
name: Build TB371FC Kernel

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建完成后发布 GitHub Release'
        required: false
        default: 'true'
        type: boolean
  push:
    branches: [main]
    paths:
      - 'arch/arm64/configs/vendor/tb371fc_defconfig'
      - '.github/workflows/build_tb371fc_sukisu.yml'

concurrency:
  group: tb371fc-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/lss4/android_kernel_lenovo_paladin.git
  KERNEL_BRANCH: "11"
  EROFS_REPO: https://github.com/lateautumn233/erofs_kernel_4_19.git
  EROFS_BRANCH: linux-4.19.y
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CLANG_VERSION: "14"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Install dependencies (pinned clang-${{ env.CLANG_VERSION }})
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc kmod cpio flex libncurses5-dev \
            libelf-dev libssl-dev dwarves bison python3 \
            python-is-python3 git curl wget zip unzip ccache \
            clang-${{ env.CLANG_VERSION }} clang lld-${{ env.CLANG_VERSION }} lld llvm \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: tb371fc-kernel-ccache-${{ github.run_id }}
          restore-keys: |
            tb371fc-kernel-ccache-

      - name: Clean old build artifacts
        run: |
          rm -rf kernel out anykernel TB371FC_kernel.zip
          mkdir -p out
          echo "=== 旧构建文件清理完成 ==="

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${KERNEL_BRANCH}" "${KERNEL_REPO}" kernel
          ls kernel/arch/arm64/configs/vendor/ | head
          echo "=== 内核源码拉取完毕 ==="

      - name: Use repository tb371fc_defconfig as single source of truth
        run: |
          SRC="$GITHUB_WORKSPACE/arch/arm64/configs/vendor/tb371fc_defconfig"
          DST="kernel/arch/arm64/configs/vendor/tb371fc_defconfig"
          if [ ! -f "$SRC" ]; then
            echo "❌ 仓库内找不到 tb371fc_defconfig"
            exit 1
          fi
          cp "$SRC" "$DST"
          echo "✅ 已使用仓库提交的 defconfig 作为唯一配置源"
          grep -c '^CONFIG_' "$DST" | xargs echo "defconfig 配置项数量:"

      - name: Setup SukiSU-Ultra
        run: |
          cd kernel
          KSU_OK=false
          if curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
               -o /tmp/ksu_setup.sh 2>/dev/null; then
            if [ -s /tmp/ksu_setup.sh ] && grep -q "kernelsu" /tmp/ksu_setup.sh 2>/dev/null; then
              if bash /tmp/ksu_setup.sh main; then
                KSU_OK=true
              fi
            fi
          fi
          if [ "$KSU_OK" = false ] || [ ! -d drivers/kernelsu ]; then
            echo "⚠️ setup.sh 失败，使用手动克隆"
            rm -rf drivers/kernelsu
            git clone --depth=1 --filter=blob:none --sparse \
              https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/sukisu_repo
            cd /tmp/sukisu_repo && git sparse-checkout set kernel && cd -
            if [ -d /tmp/sukisu_repo/kernel/kernelsu ]; then
              cp -r /tmp/sukisu_repo/kernel/kernelsu drivers/kernelsu
            elif [ -d /tmp/sukisu_repo/kernel ]; then
              cp -r /tmp/sukisu_repo/kernel drivers/kernelsu
            fi
            rm -rf /tmp/sukisu_repo
          fi
          if [ ! -d drivers/kernelsu ]; then
            echo "❌ SukiSU 注入失败"
            exit 1
          fi
          echo "✅ SukiSU 目录已就位"
          if ! grep -q "EXPORT_SYMBOL_GPL(kallsyms_lookup_name)" kernel/kallsyms.c 2>/dev/null; then
            echo 'EXPORT_SYMBOL_GPL(kallsyms_lookup_name);' >> kernel/kallsyms.c
          fi
          if [ -f drivers/kernelsu/Kconfig ] && \
             ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q 'kernelsu/' drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi
          cd ..
          echo "=== SukiSU 注入完成 ==="

      - name: Backport compatible EROFS for Linux 4.19
        run: |
          cd kernel
          rm -rf fs/erofs erofs_tmp
          mkdir -p include/linux
          git clone --depth=1 -b "${EROFS_BRANCH}" "${EROFS_REPO}" erofs_tmp
          if [ ! -d erofs_tmp/fs/erofs ]; then
            echo "❌ EROFS 源码目录不存在"
            exit 1
          fi
          fs_ctx_ok=false
          fs_parse_ok=false
          if [ -f erofs_tmp/include/linux/fs_context.h ]; then
            cp erofs_tmp/include/linux/fs_context.h include/linux/fs_context.h
            fs_ctx_ok=true
          fi
          if [ -f erofs_tmp/include/linux/fs_parser.h ]; then
            cp erofs_tmp/include/linux/fs_parser.h include/linux/fs_parser.h
            fs_parse_ok=true
          fi
          if [ "$fs_ctx_ok" = false ]; then
            found=$(find erofs_tmp -name "fs_context.h" -path "*/linux/*" 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              cp "$found" include/linux/fs_context.h
              fs_ctx_ok=true
            fi
          fi
          if [ "$fs_parse_ok" = false ]; then
            found=$(find erofs_tmp -name "fs_parser.h" -path "*/linux/*" 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              cp "$found" include/linux/fs_parser.h
              fs_parse_ok=true
            fi
          fi
          if [ "$fs_ctx_ok" = false ]; then
            if ! grep -rq "fs_context.h\|fs_parser.h" erofs_tmp/fs/erofs/ 2>/dev/null; then
              fs_ctx_ok=true
              fs_parse_ok=true
            fi
          fi
          if [ "$fs_ctx_ok" = false ]; then
            cat > include/linux/fs_context.h << 'STUB_EOF'
          #ifndef _LINUX_FS_CONTEXT_H
          #define _LINUX_FS_CONTEXT_H
          #include <linux/parser.h>
          #include <linux/security.h>
          struct fs_context;
          #endif
          STUB_EOF
          fi
          if [ "$fs_parse_ok" = false ]; then
            cat > include/linux/fs_parser.h << 'STUB_EOF'
          #ifndef _LINUX_FS_PARSER_H
          #define _LINUX_FS_PARSER_H
          #include <linux/parser.h>
          #endif
          STUB_EOF
          fi
          cp -r erofs_tmp/fs/erofs fs/
          rm -rf erofs_tmp
          if ! grep -q 'obj-$(CONFIG_EROFS_FS) += erofs/' fs/Makefile; then
            echo 'obj-$(CONFIG_EROFS_FS) += erofs/' >> fs/Makefile
          fi
          if ! grep -q 'source "fs/erofs/Kconfig"' fs/Kconfig; then
            if grep -q 'source "fs/fuse/Kconfig"' fs/Kconfig; then
              sed -i '/source "fs\/fuse\/Kconfig"/a source "fs/erofs/Kconfig"' fs/Kconfig
            else
              echo 'source "fs/erofs/Kconfig"' >> fs/Kconfig
            fi
          fi
          cd ..
          echo "=== EROFS 4.19 适配移植完成 ==="

      - name: Build Kernel with Clang (ccache enabled)
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="ccache clang-${{ env.CLANG_VERSION }}"
          export HOSTCC="ccache clang-${{ env.CLANG_VERSION }}"
          export HOSTCXX="ccache clang++-${{ env.CLANG_VERSION }}"
          export CCACHE_NOHASHDIR=1
          export CCACHE_BASEDIR="$(pwd)"
          OUT_DIR="../out"
          set -e
          set -o pipefail

          # 使用 LLVM_IAS=0 禁用 Clang 内置汇编器，改用 GNU as
          make O="${OUT_DIR}" vendor/tb371fc_defconfig CC="${CC}" LLVM=1 LLVM_IAS=0

          for cfg in CONFIG_KSU CONFIG_EROFS_FS CONFIG_OVERLAY_FS CONFIG_KPROBES CONFIG_PID_NS; do
            grep "^${cfg}=" "${OUT_DIR}/.config" || echo "  ${cfg}=NOT_FOUND"
          done

          make -j"$(nproc)" O="${OUT_DIR}" Image CC="${CC}" LLVM=1 LLVM_IAS=0
          make -j"$(nproc)" O="${OUT_DIR}" dtbs CC="${CC}" LLVM=1 LLVM_IAS=0 || echo "⚠️ DTB 编译跳过"
          make -j"$(nproc)" O="${OUT_DIR}" modules CC="${CC}" LLVM=1 LLVM_IAS=0 || echo "⚠️ modules 编译跳过"
          mkdir -p "${OUT_DIR}/modules"
          make O="${OUT_DIR}" modules_install INSTALL_MOD_PATH="${OUT_DIR}/modules" CC="${CC}" LLVM=1 LLVM_IAS=0 || true
          cd ..
          echo "===== 内核编译完成 ====="

      - name: Check compiled kernel image
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "✅ Image: $(ls -lh out/arch/arm64/boot/Image)"
          else
            echo "❌ Image not found"
            exit 1
          fi
          ls out/arch/arm64/boot/dts/vendor/qcom/kona*.dtb 2>/dev/null && echo "✅ DTB exists" || echo "⚠️ No DTB"
          # 记录内核版本供 Release 使用
          if [ -f out/include/config/kernel.release ]; then
            echo "KERNEL_VER=$(cat out/include/config/kernel.release)" >> "$GITHUB_ENV"
          else
            echo "KERNEL_VER=unknown" >> "$GITHUB_ENV"
          fi

      - name: Package kernel with AnyKernel3
        run: |
          git clone --depth=1 "${ANYKERNEL_REPO}" anykernel
          cp out/arch/arm64/boot/Image anykernel/
          cp out/arch/arm64/boot/dts/vendor/qcom/kona*.dtb anykernel/ 2>/dev/null || true
          mkdir -p anykernel/modules
          find out/modules -name "*.ko" -exec cp {} anykernel/modules/ \; 2>/dev/null || true
          cd anykernel
          if grep -q 'kernel.string=' anykernel.sh 2>/dev/null; then
            sed -i 's|kernel.string=.*|kernel.string=TB371FC-SukiSU-EROFS|' anykernel.sh
          else
            echo "kernel.string=TB371FC-SukiSU-EROFS" >> anykernel.sh
          fi
          sed -i 's|do.devicecheck=1|do.devicecheck=0|' anykernel.sh 2>/dev/null || true
          zip -r9 ../TB371FC_kernel.zip .
          cd ..
          echo "✅ 打包完成：$(ls -lh TB371FC_kernel.zip)"

      - name: Upload kernel zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: TB371FC_SukiSU_EROFS_Kernel
          path: TB371FC_kernel.zip
          retention-days: 90

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.publish_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tb371fc-${{ github.run_id }}
          name: "TB371FC Kernel ${{ env.KERNEL_VER }} (build ${{ github.run_id }})"
          files: TB371FC_kernel.zip
          body: |
            ## TB371FC 安卓内核构建 (SukiSU-Ultra + EROFS)

            - **内核版本**: `${{ env.KERNEL_VER }}`
            - **设备**: 联想小新 Pad Pro 12.7 (TB371FC) / SM8250 骁龙 870
            - **集成**: SukiSU-Ultra (KernelSU Root + KPM)、EROFS (LZ4)、Android 16 兼容
            - **编译**: Clang ${{ env.CLANG_VERSION }} + ccache

            ### 本次优化要点
            - 仓库 `tb371fc_defconfig` 现为唯一配置源 (修复旧版被覆盖的死代码问题)
            - 关闭发布版调试选项 (DEBUG_INFO / CORESIGHT / IOMMU_DEBUG / DEBUG_LIST / IPA_UT)
            - 启用 `CONFIG_PID_NS` 与 schedutil 默认调频
            - 去除 defconfig 重复符号, 补全 `CONFIG_KSU` / `CONFIG_CRYPTO_LZ4`

            刷入方式: TWRP / 自定义 Recovery 卡刷 `TB371FC_kernel.zip`。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ccache stats
        if: always()
        run: ccache -s || true
