      # TB371FC Kernel Build with SukiSU-Ultra + EROFS + Android 16 Support
      # Based on lss4/android_kernel_lenovo_paladin
      # Target: Lenovo TB371FC / TB-Q706F / SM8250
      # Compatible: ColorOS 15, HyperOS 3, Android 16
      - name: Backport compatible EROFS for Linux 4.19
        run: |
          cd kernel

          rm -rf fs/erofs erofs_tmp
          mkdir -p include/linux

          # TB371FC Kernel Build with SukiSU-Ultra + EROFS + Android 16 Support
          # Based on lss4/android_kernel_lenovo_paladin
          # Target: Lenovo TB371FC / TB-Q706F / SM8250
          # Compatible: ColorOS 15, HyperOS 3, Android 16
          # 先克隆 EROFS 仓库，从仓库内部查找所需头文件
          git clone --depth=1 -b "${EROFS_BRANCH}" "${EROFS_REPO}" erofs_tmp

          if [ ! -d erofs_tmp/fs/erofs ]; then
            echo "❌ EROFS 源码目录不存在"
            exit 1
          fi

          # TB371FC Kernel Build with SukiSU-Ultra + EROFS + Android 16 Support
          # Based on lss4/android_kernel_lenovo_paladin
          # Target: Lenovo TB371FC / TB-Q706F / SM8250
          # Compatible: ColorOS 15, HyperOS 3, Android 16
          # 策略1: 从 EROFS backport 仓库中查找 fs_context.h / fs_parser.h
          fs_ctx_ok=false
          fs_parse_ok=false

          if [ -f erofs_tmp/include/linux/fs_context.h ]; then
            cp erofs_tmp/include/linux/fs_context.h include/linux/fs_context.h
            fs_ctx_ok=true
            echo "✅ fs_context.h 从 EROFS 仓库获取"
          fi

          if [ -f erofs_tmp/include/linux/fs_parser.h ]; then
            cp erofs_tmp/include/linux/fs_parser.h include/linux/fs_parser.h
            fs_parse_ok=true
            echo "✅ fs_parser.h 从 EROFS 仓库获取"
          fi

          # TB371FC Kernel Build with SukiSU-Ultra + EROFS + Android 16 Support
          # Based on lss4/android_kernel_lenovo_paladin
          # Target: Lenovo TB371FC / TB-Q706F / SM8250
          # Compatible: ColorOS 15, HyperOS 3, Android 16
          # 策略2: 在整个仓库中递归搜索
          if [ "$fs_ctx_ok" = false ]; then
            found=$(find erofs_tmp -name "fs_context.h" -path "*/linux/*" 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              cp "$found" include/linux/fs_context.h
              fs_ctx_ok=true
              echo "✅ fs_context.h 从仓库内部找到: $found"
            fi
          fi

          if [ "$fs_parse_ok" = false ]; then
            found=$(find erofs_tmp -name "fs_parser.h" -path "*/linux/*" 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              cp "$found" include/linux/fs_parser.h
              fs_parse_ok=true
              echo "✅ fs_parser.h 从仓库内部找到: $found"
            fi
          fi

          # TB371FC Kernel Build with SukiSU-Ultra + EROFS + Android 16 Support
          # Based on lss4/android_kernel_lenovo_paladin
          # Target: Lenovo TB371FC / TB-Q706F / SM8250
          # Compatible: ColorOS 15, HyperOS 3, Android 16
          # 策略3: 检查 EROFS 代码是否真的需要这两个头文件
          # 如果 EROFS backport 本身已经适配了 4.19，则可能不需要
          if [ "$fs_ctx_ok" = false ]; then
            if ! grep -rq "fs_context.h\|fs_parser.h" erofs_tmp/fs/erofs/ 2>/dev/null; then
              echo "✅ EROFS backport 源码不引用 fs_context.h/fs_parser.h，跳过"
              fs_ctx_ok=true
              fs_parse_ok=true
            fi
          fi

          # TB371FC Kernel Build with SukiSU-Ultra + EROFS + Android 16 Support
          # Based on lss4/android_kernel_lenovo_paladin
          # Target: Lenovo TB371FC / TB-Q706F / SM8250
          # Compatible: ColorOS 15, HyperOS 3, Android 16
          # 策略4: 如果 EROFS 代码引用了但仓库未提供，创建最小兼容桩文件
          if [ "$fs_ctx_ok" = false ]; then
            echo "⚠️ 创建 fs_context.h 最小兼容桩"
            cat > include/linux/fs_context.h << 'STUB_EOF'
          /* Minimal fs_context.h stub for EROFS on Linux 4.19 */
          #ifndef _LINUX_FS_CONTEXT_H
          #define _LINUX_FS_CONTEXT_H
          #include <linux/parser.h>
          #include <linux/security.h>
          struct fs_context;
          #endif
          STUB_EOF
            fs_ctx_ok=true
          fi

          if [ "$fs_parse_ok" = false ]; then
            echo "⚠️ 创建 fs_parser.h 最小兼容桩"
            cat > include/linux/fs_parser.h << 'STUB_EOF'
          /* Minimal fs_parser.h stub for EROFS on Linux 4.19 */
          #ifndef _LINUX_FS_PARSER_H
          #define _LINUX_FS_PARSER_H
          #include <linux/parser.h>
          #endif
          STUB_EOF
            fs_parse_ok=true
          fi

          # TB371FC Kernel Build with SukiSU-Ultra + EROFS + Android 16 Support
          # Based on lss4/android_kernel_lenovo_paladin
          # Target: Lenovo TB371FC / TB-Q706F / SM8250
          # Compatible: ColorOS 15, HyperOS 3, Android 16
          # 复制 EROFS 源码
          cp -r erofs_tmp/fs/erofs fs/
          rm -rf erofs_tmp

          if ! grep -q 'obj-$(CONFIG_EROFS_FS) += erofs/' fs/Makefile; then
            echo 'obj-$(CONFIG_EROFS_FS) += erofs/' >> fs/Makefile
          fi

          if ! grep -q 'source "fs/erofs/Kconfig"' fs/Kconfig; then
            if grep -q 'source "fs/fuse/Kconfig"' fs/Kconfig; then
              sed -i '/source "fs\/fuse\/Kconfig"/a source "fs/erofs/Kconfig"' fs/Kconfig
            else
              echo 'source "fs/erofs/Kconfig"' >> fs/Kconfig
            fi
          fi

          cd ..
          echo "=== EROFS 4.19 适配移植完成 ==="
