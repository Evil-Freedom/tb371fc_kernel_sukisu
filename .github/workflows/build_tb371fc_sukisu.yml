# TB371FC Kernel Build with SukiSU-Ultra + EROFS + Android 16 Support
# Based on lss4/android_kernel_lenovo_paladin (TB-Q706F, SM8250)
# Compatible: ColorOS 15, HyperOS 3, Android 16 (with fuck-bpf patches)

name: Build TB371FC Kernel
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        sudo apt-get clean
        df -h

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc kmod cpio flex libncurses5-dev \
          libelf-dev libssl-dev dwarves bison python3 \
          python-is-python3 git curl wget zip unzip \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          clang lld llvm

    - name: Clone kernel source
      run: |
        rm -rf kernel out anykernel TB371FC_kernel.zip
        git clone --depth=1 -b 11 \
          https://github.com/lss4/android_kernel_lenovo_paladin.git kernel
        ls kernel/
        ls kernel/arch/arm64/configs/vendor/

    - name: Setup SukiSU-Ultra
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main || {
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git drivers/kernelsu
        }

        # 修正：内核源码目录下的 kernel/kallsyms.c 正确路径
        if ! grep -q "EXPORT_SYMBOL_GPL(kallsyms_lookup_name)" kernel/kallsyms.c 2>/dev/null; then
          echo "EXPORT_SYMBOL_GPL(kallsyms_lookup_name);" >> kernel/kallsyms.c
          echo "Patched kernel/kallsyms.c"
        fi

        if ! grep -q "kernelsu/Kconfig" drivers/Kconfig 2>/dev/null; then
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi

        if ! grep -q "kernelsu" drivers/Makefile 2>/dev/null; then
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
        fi
        cd ..

    - name: Backport EROFS filesystem
      run: |
        cd kernel
        mkdir -p fs/erofs
        EROFS_FILES="Kconfig Makefile compress.h data.c decompressor.c dir.c \
                     erofs_fs.h inode.c internal.h namei.c super.c tagptr.h \
                     utils.c xattr.c xattr.h zdata.c zdata.h zmap.c zpvec.h"
        for f in $EROFS_FILES; do
          curl -f -sL "https://raw.githubusercontent.com/lateautumn233/erofs_kernel_4_19/linux-4.19.y/fs/erofs/$f" -o "fs/erofs/$f" || echo "Skip missing file: $f"
        done

        if ! grep -q 'erofs' fs/Makefile; then
          echo 'obj-$(CONFIG_EROFS_FS) += erofs/' >> fs/Makefile
        fi
        if ! grep -q 'erofs/Kconfig' fs/Kconfig; then
          sed -i '/source "fs\/fuse\/Kconfig"/a source "fs\/erofs\/Kconfig"' fs/Kconfig
        fi
        cd ..

    - name: Create TB371FC defconfig
      run: |
        cd kernel
        cp arch/arm64/configs/vendor/kona-perf_defconfig \
           arch/arm64/configs/vendor/tb371fc_defconfig

        cat >> arch/arm64/configs/vendor/tb371fc_defconfig << 'EOF'
        # ========== TB371FC (小新Pad Pro 12.7) 补充配置 ==========
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_OVERLAY_FS=y
        CONFIG_TMPFS_XATTR=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_BUILD_IMAGE=y

        CONFIG_EROFS_FS=y
        CONFIG_EROFS_FS_XATTR=y
        CONFIG_EROFS_FS_POSIX_ACL=y
        CONFIG_EROFS_FS_SECURITY=y
        CONFIG_EROFS_FS_ZIP=y
        CONFIG_EROFS_FS_CLUSTER_PAGE_LIMIT=1
        CONFIG_LIBCRC32C=y
        CONFIG_LZ4_DECOMPRESS=y

        CONFIG_SND_SOC_AS33970=y
        CONFIG_SND_SOC_ES7210=y
        CONFIG_SENSORS_SSC=y
        CONFIG_SENSORS_HALL=y
        CONFIG_TOUCHSCREEN_FTS=y
        CONFIG_TOUCHSCREEN_GOODIX_BRL=y
        CONFIG_TOUCHSCREEN_GOODIX_BRL_SPI=y
        CONFIG_TOUCHSCREEN_GOODIX_BRL_GESTURE=y
        CONFIG_GOODIX_FINGERPRINT=y
        CONFIG_BACKLIGHT_QCOM_SPMI_WLED=y
        CONFIG_BT_SLIM_QCA6390=y
        CONFIG_CNSS2_QMI=y
        CONFIG_BATTERY_BQ27XXX=y
        CONFIG_BATTERY_BQ27XXX_I2C=y
        CONFIG_SMB1398_CHARGER=y
        CONFIG_FUSE=y
        CONFIG_CGROUPS=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_CPUACCT=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_CGROUP_BPF=y
        CONFIG_BPF_SYSCALL=y
        CONFIG_BPF_JIT=y
        CONFIG_BPF_JIT_ALWAYS_ON=y
        CONFIG_NAMESPACES=y
        CONFIG_UTS_NS=y
        CONFIG_IPC_NS=y
        CONFIG_NET_NS=y
        CONFIG_SECCOMP=y
        CONFIG_SECCOMP_FILTER=y
        CONFIG_ZRAM=y
        CONFIG_ZSWAP=y
        CONFIG_NET=y
        CONFIG_INET=y
        CONFIG_IPV6=y
        CONFIG_PM_WAKELOCKS=y
        CONFIG_POWER_SUPPLY=y
        CONFIG_EXFAT_FS=y
        EOF
        cd ..

    - name: Build kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        mkdir -p ../out

        set -e -o pipefail

        # 1. 生成配置
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang CLANG_TRIPLE=aarch64-linux-gnu- vendor/tb371fc_defconfig O=../out

        # 2. 编译内核 Image
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang CLANG_TRIPLE=aarch64-linux-gnu- Image O=../out

        # 3. 编译模块
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang CLANG_TRIPLE=aarch64-linux-gnu- modules O=../out
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang CLANG_TRIPLE=aarch64-linux-gnu- modules_install INSTALL_MOD_PATH=../out/modules O=../out
        cd ..

    - name: Check build output
      run: |
        echo "=== Build output check ==="
        ls -la out/arch/arm64/boot/
        if [ -f out/arch/arm64/boot/Image ]; then
          echo "✅ Kernel Image: $(ls -lh out/arch/arm64/boot/Image)"
        else
          echo "❌ Kernel Image not found!"
          exit 1
        fi
        ls out/arch/arm64/boot/dts/vendor/qcom/*.dtb 2>/dev/null && echo "✅ DTB found" || echo "⚠️ No DTB"

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git anykernel
        cp out/arch/arm64/boot/Image anykernel/
        cp out/arch/arm64/boot/dts/vendor/qcom/kona*.dtb anykernel/ 2>/dev/null || true
        
        # 确保 anykernel/modules 目录存在
        mkdir -p anykernel/modules
        find out/modules -name "*.ko" -exec cp {} anykernel/modules/ \; 2>/dev/null || true
        
        cd anykernel
        sed -i 's|kernel.string=.*|kernel.string=TB371FC-SukiSU|' anykernel.sh
        sed -i 's|do.devicecheck=1|do.devicecheck=0|' anykernel.sh
        zip -r9 ../TB371FC_kernel.zip .
        cd ..
        ls -lh TB371FC_kernel.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TB371FC_SukiSU_kernel
        path: TB371FC_kernel.zip
        retention-days: 90
