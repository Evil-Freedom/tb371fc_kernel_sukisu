          sed -i 's|kernel.string=.*|kernel.string=TB371FC-SukiSU-EROFS|' anykernel.sh
          sed -i 's|do.devicecheck=1|do.devicecheck=0|' anykernel.sh
          sed -i 's|do.modules=0|do.modules=1|' anykernel.sh || true
          sed -i 's|do.cleanup=1|do.cleanup=0|' anykernel.sh || true

          # 打包
          zip -r9 ../TB371FC_kernel.zip .

          cd ..
          echo "✅ 刷机包打包完成：$(ls -lh TB371FC_kernel.zip)"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: TB371FC_SukiSU_EROFS_Kernel
          path: TB371FC_kernel.zip
          retention-days: 90

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            out/*.log
            out/**/*.log
          retention-days: 7
