name: Build TB371FC Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel source branch'
        required: true
        default: '11'
      su_branch:
        description: 'SukiSU branch'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "===== Freeing disk space ====="
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo docker image prune -af || true
          df -h

      - name: Install dependencies
        run: |
          echo "===== Installing dependencies ====="
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc kmod cpio flex libncurses5-dev \
            libelf-dev libssl-dev dwarves bison python3 \
            python-is-python3 git curl wget zip unzip \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libstdc++6 texinfo
          # AOSP Clang 是 x86_64 预编译版，需要 32 位库支持
          sudo apt-get install -y libc6-i386 lib32stdc++6 lib32z1 || true

      - name: Download AOSP Clang
        run: |
          echo "===== Downloading AOSP Clang ====="
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains

          # 使用 Android 12/13 兼容的 Clang r450784d（Linux 4.19 稳定可用）
          CLANG_VERSION="clang-r450784d"
          if [ ! -d "${CLANG_VERSION}" ]; then
            curl -Lo ${CLANG_VERSION}.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/${CLANG_VERSION}.tar.gz"
            mkdir -p ${CLANG_VERSION}
            tar -xf ${CLANG_VERSION}.tar.gz -C ${CLANG_VERSION}
            rm -f ${CLANG_VERSION}.tar.gz
          fi

          echo "PATH=$HOME/toolchains/${CLANG_VERSION}/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$HOME/toolchains/${CLANG_VERSION}/bin/clang" >> $GITHUB_ENV
          $HOME/toolchains/${CLANG_VERSION}/bin/clang --version

      - name: Clean old build artifacts
        run: |
          echo "===== Cleaning old artifacts ====="
          rm -rf kernel out anykernel TB371FC_kernel.zip llvm-project
          mkdir -p out
          echo "✅ 旧构建文件清理完成"

      - name: Clone kernel source
        run: |
          echo "===== Cloning kernel source ====="
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} \
            https://github.com/lss4/android_kernel_lenovo_paladin.git kernel

          cd kernel
          echo "===== Available defconfigs ====="
          ls -la arch/arm64/configs/vendor/ || true
          cd ..

      - name: Setup SukiSU-Ultra
        run: |
          echo "===== Setting up SukiSU-Ultra ====="
          cd kernel

          # 优先使用官方 setup 脚本
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s ${{ github.event.inputs.su_branch }} || {
            echo "⚠️ setup.sh failed, fallback to manual clone"
            rm -rf drivers/kernelsu
            git clone --depth=1 -b ${{ github.event.inputs.su_branch }} \
              https://github.com/SukiSU-Ultra/SukiSU-Ultra.git drivers/kernelsu
          }

          # 导出 kallsyms_lookup_name
          if [ -f kernel/kallsyms.c ] && ! grep -q "EXPORT_SYMBOL_GPL(kallsyms_lookup_name)" kernel/kallsyms.c; then
            echo "EXPORT_SYMBOL_GPL(kallsyms_lookup_name);" >> kernel/kallsyms.c
            echo "✅ Patched kernel/kallsyms.c"
          fi

          # 添加 Kconfig 和 Makefile 引用
          if [ -f drivers/Kconfig ] && ! grep -q "kernelsu/Kconfig" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
            echo "✅ Patched drivers/Kconfig"
          fi

          if [ -f drivers/Makefile ] && ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
            echo "✅ Patched drivers/Makefile"
          fi

          cd ..

      - name: Backport EROFS for Linux 4.19
        run: |
          echo "===== Backporting EROFS ====="
          cd kernel

          rm -rf fs/erofs erofs_tmp
          mkdir -p include/linux

          # 仅当文件不存在时才下载，避免覆盖现有头导致问题
          [ -f include/linux/fs_context.h ] || \
            curl -f -sL "https://raw.githubusercontent.com/aosp-mirror/kernel_common/android-4.19-stable/include/linux/fs_context.h" \
              -o include/linux/fs_context.h || echo "⚠️ fs_context.h skipped"

          [ -f include/linux/fs_parser.h ] || \
            curl -f -sL "https://raw.githubusercontent.com/aosp-mirror/kernel_common/android-4.19-stable/include/linux/fs_parser.h" \
              -o include/linux/fs_parser.h || echo "⚠️ fs_parser.h skipped"

          git clone --depth=1 -b linux-4.19.y \
            https://github.com/lateautumn233/erofs_kernel_4_19.git erofs_tmp

          if [ -d erofs_tmp/fs/erofs ]; then
            cp -r erofs_tmp/fs/erofs fs/
            rm -rf erofs_tmp
            echo "✅ EROFS source copied"
          else
            echo "❌ EROFS source not found in cloned repo"
            exit 1
          fi

          # 注册到 fs/Makefile
          if ! grep -q 'erofs' fs/Makefile; then
            echo 'obj-$(CONFIG_EROFS_FS) += erofs/' >> fs/Makefile
            echo "✅ Registered EROFS in fs/Makefile"
          fi

          # 注册到 fs/Kconfig
          if ! grep -q 'erofs/Kconfig' fs/Kconfig; then
            sed -i '/source "fs\/fuse\/Kconfig"/a source "fs\/erofs\/Kconfig"' fs/Kconfig
            echo "✅ Registered EROFS in fs/Kconfig"
          fi

          cd ..

      - name: Generate TB371FC custom defconfig
        run: |
          echo "===== Generating custom defconfig ====="
          cd kernel

          cp arch/arm64/configs/vendor/kona-perf_defconfig \
             arch/arm64/configs/vendor/tb371fc_defconfig

          cat >> arch/arm64/configs/vendor/tb371fc_defconfig << 'EOF'

          # ========== TB371FC 小新Pad Pro 12.7 定制配置 ==========
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # SukiSU
          CONFIG_KSU=y

          # EROFS 文件系统配置
          CONFIG_EROFS_FS=y
          CONFIG_EROFS_FS_XATTR=y
          CONFIG_EROFS_FS_POSIX_ACL=y
          CONFIG_EROFS_FS_SECURITY=y
          CONFIG_EROFS_FS_ZIP=y
          CONFIG_EROFS_FS_CLUSTER_PAGE_LIMIT=1
          CONFIG_LIBCRC32C=y
          CONFIG_LZ4_DECOMPRESS=y

          # 硬件驱动配置
          CONFIG_SND_SOC_AS33970=y
          CONFIG_SND_SOC_ES7210=y
          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_HALL=y
          CONFIG_TOUCHSCREEN_FTS=y
          CONFIG_TOUCHSCREEN_GOODIX_BRL=y
          CONFIG_TOUCHSCREEN_GOODIX_BRL_SPI=y
          CONFIG_TOUCHSCREEN_GOODIX_BRL_GESTURE=y
          CONFIG_GOODIX_FINGERPRINT=y
          CONFIG_BACKLIGHT_QCOM_SPMI_WLED=y
          CONFIG_BT_SLIM_QCA6390=y
          CONFIG_CNSS2_QMI=y
          CONFIG_BATTERY_BQ27XXX=y
          CONFIG_BATTERY_BQ27XXX_I2C=y
          CONFIG_SMB1398_CHARGER=y

          # Android16 / HyperOS / ColorOS 15 系统兼容
          CONFIG_FUSE=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_NET_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_ZRAM=y
          CONFIG_ZSWAP=y
          CONFIG_NET=y
          CONFIG_INET=y
          CONFIG_IPV6=y
          CONFIG_PM_WAKELOCKS=y
          CONFIG_POWER_SUPPLY=y
          CONFIG_EXFAT_FS=y
          EOF

          cd ..
          echo "✅ TB371FC 自定义 defconfig 生成完毕"

      - name: Build Kernel
        run: |
          echo "===== Building kernel ====="
          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=${CC:-clang}
          OUT_DIR=../out

          set -e -o pipefail

          echo "===== make defconfig ====="
          make O=${OUT_DIR} \
            CC=clang LLVM=1 \
            vendor/tb371fc_defconfig

          echo "===== compiling Image ====="
          make -j$(nproc) O=${OUT_DIR} \
            CC=clang LLVM=1 \
            Image

          echo "===== compiling modules ====="
          make -j$(nproc) O=${OUT_DIR} \
            CC=clang LLVM=1 \
            modules

          echo "===== installing modules ====="
          make O=${OUT_DIR} \
            INSTALL_MOD_PATH=${OUT_DIR}/modules \
            modules_install

          cd ..
          echo "✅ 内核编译流程执行完成"

      - name: Check compiled kernel image
        run: |
          echo "===== Checking build output ====="
          find out -name "Image" -o -name "Image.gz" -o -name "*.dtb" 2>/dev/null | head -50

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "✅ Kernel Image built successfully: $(ls -lh out/arch/arm64/boot/Image)"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "✅ Kernel Image.gz built successfully: $(ls -lh out/arch/arm64/boot/Image.gz)"
          else
            echo "❌ Kernel Image not found, compile failed"
            exit 1
          fi

          DTB_COUNT=$(find out -name "kona*.dtb" 2>/dev/null | wc -l)
          if [ "$DTB_COUNT" -gt 0 ]; then
            echo "✅ Found $DTB_COUNT DTB files"
            find out -name "kona*.dtb" 2>/dev/null
          else
            echo "⚠️ No DTB files found (you may need stock dtbo)"
          fi

      - name: Package kernel with AnyKernel3
        run: |
          echo "===== Packaging with AnyKernel3 ====="
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

          # 复制 kernel image
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image anykernel/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
          fi

          # 自动查找并复制 DTB
          find out -name "kona*.dtb" -exec cp {} anykernel/ \; 2>/dev/null || true

          # 收集模块
          mkdir -p anykernel/modules
          find out/modules -name "*.ko" -exec cp {} anykernel/modules/ \; 2>/dev/null || true
          echo "Modules packed: $(ls anykernel/modules/ | wc -l)"

          # 修改 AnyKernel3 配置
          cd anykernel
          sed -i 's|kernel.string=.*|kernel.string=TB371FC-SukiSU-EROFS|' anykernel.sh
          sed -i 's|do.devicecheck=1|do.devicecheck=0|' anykernel.sh
          sed -i 's|do.modules=0|do.modules=1|' anykernel.sh || true
          sed -i 's|do.cleanup=1|do.cleanup=0|' anykernel.sh || true

          # 打包
          zip -r9 ../TB371FC_kernel.zip .

          cd ..
          echo "✅ 刷机包打包完成：$(ls -lh TB371FC_kernel.zip)"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: TB371FC_SukiSU_EROFS_Kernel
          path: TB371FC_kernel.zip
          retention-days: 90

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            out/*.log
            out/**/*.log
          retention-days: 7
