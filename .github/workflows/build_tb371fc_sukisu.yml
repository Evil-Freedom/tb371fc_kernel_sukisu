# TB371FC Kernel Build with SukiSU-Ultra + EROFS + Android 16 Support
# Based on lss4/android_kernel_lenovo_paladin (TB-Q706F, SM8250)
# Compatible: ColorOS 15, HyperOS 3, Android 16 (with fuck-bpf patches)

name: Build TB371FC Kernel
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        sudo apt-get clean
        df -h

    - name: Install basic dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc kmod cpio flex libncurses5-dev \
          libelf-dev libssl-dev dwarves bison python3 \
          python-is-python3 git curl wget zip unzip clang lld \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Clean old build artifacts
      run: |
        rm -rf kernel out anykernel TB371FC_kernel.zip llvm-project
        mkdir -p out

    - name: Clone kernel source
      run: |
        git clone --depth=1 -b 11 https://github.com/lss4/android_kernel_lenovo_paladin.git kernel
        ls kernel/arch/arm64/configs/vendor/

    - name: Setup SukiSU-Ultra
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main || {
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git drivers/kernelsu
        }

        # 修正：补全正确路径 kernel/kallsyms.c
        if ! grep -q "EXPORT_SYMBOL_GPL(kallsyms_lookup_name)" kernel/kallsyms.c 2>/dev/null; then
          echo "EXPORT_SYMBOL_GPL(kallsyms_lookup_name);" >> kernel/kallsyms.c
          echo "Patched kernel/kallsyms.c successfully"
        fi

        if ! grep -q "kernelsu/Kconfig" drivers/Kconfig; then
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi

        if ! grep -q "kernelsu" drivers/Makefile; then
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
        fi
        cd ..

    - name: Backport compatible EROFS for Linux 4.19
      run: |
        cd kernel
        rm -rf fs/erofs

        # 补全 EROFS 依赖的 AOSP 4.19 Mount API 头文件
        curl -sL "https://raw.githubusercontent.com/aosp-mirror/kernel_common/android-4.19-stable/include/linux/fs_context.h" -o include/linux/fs_context.h
        curl -sL "https://raw.githubusercontent.com/aosp-mirror/kernel_common/android-4.19-stable/include/linux/fs_parser.h" -o include/linux/fs_parser.h

        # 拉取 4.19 专用的 EROFS 驱动源码
        git clone --depth=1 -b linux-4.19.y https://github.com/lateautumn233/erofs_kernel_4_19.git fs/erofs

        if ! grep -q 'erofs' fs/Makefile; then
          echo 'obj-$(CONFIG_EROFS_FS) += erofs/' >> fs/Makefile
        fi

        if ! grep -q 'erofs/Kconfig' fs/Kconfig; then
          sed -i '/source "fs\/fuse\/Kconfig"/a source "fs\/erofs\/Kconfig"' fs/Kconfig
        fi
        cd ..

    - name: Generate TB371FC custom defconfig
      run: |
        cd kernel
        cp arch/arm64/configs/vendor/kona-perf_defconfig arch/arm64/configs/vendor/tb371fc_defconfig

        cat >> arch/arm64/configs/vendor/tb371fc_defconfig << 'EOF'
# ========== TB371FC 小新Pad Pro 12.7 ==========
CONFIG_KPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_OVERLAY_FS=y
CONFIG_TMPFS_XATTR=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y

# EROFS
CONFIG_EROFS_FS=y
CONFIG_EROFS_FS_XATTR=y
CONFIG_EROFS_FS_POSIX_ACL=y
CONFIG_EROFS_FS_SECURITY=y
CONFIG_EROFS_FS_ZIP=y
CONFIG_EROFS_FS_CLUSTER_PAGE_LIMIT=1
CONFIG_LIBCRC32C=y
CONFIG_LZ4_DECOMPRESS=y

# 硬件驱动
CONFIG_SND_SOC_AS33970=y
CONFIG_SND_SOC_ES7210=y
CONFIG_SENSORS_SSC=y
CONFIG_SENSORS_HALL=y
CONFIG_TOUCHSCREEN_FTS=y
CONFIG_TOUCHSCREEN_GOODIX_BRL=y
CONFIG_TOUCHSCREEN_GOODIX_BRL_SPI=y
CONFIG_TOUCHSCREEN_GOODIX_BRL_GESTURE=y
CONFIG_GOODIX_FINGERPRINT=y
CONFIG_BACKLIGHT_QCOM_SPMI_WLED=y
CONFIG_BT_SLIM_QCA6390=y
CONFIG_CNSS2_QMI=y
CONFIG_BATTERY_BQ27XXX=y
CONFIG_BATTERY_BQ27XXX_I2C=y
CONFIG_SMB1398_CHARGER=y

# Android16 / HyperOS / ColorOS 15 兼容
CONFIG_FUSE=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_BPF_JIT_ALWAYS_ON=y
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_NET_NS=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_ZRAM=y
CONFIG_ZSWAP=y
CONFIG_NET=y
CONFIG_INET=y
CONFIG_IPV6=y
CONFIG_PM_WAKELOCKS=y
CONFIG_POWER_SUPPLY=y
CONFIG_EXFAT_FS=y
EOF
        cd ..

    - name: Build Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        OUT_DIR=../out

        set -e -o pipefail

        # 1. 生成配置
        make vendor/tb371fc_defconfig O=${OUT_DIR} CC=clang LLVM=1 LLVM_IAS=1

        # 2. 明确编译 Image 目标
        make -j$(nproc) Image O=${OUT_DIR} CC=clang LLVM=1 LLVM_IAS=1

        # 3. 编译与安装驱动模块
        make -j$(nproc) modules O=${OUT_DIR} CC=clang LLVM=1 LLVM_IAS=1
        make modules_install INSTALL_MOD_PATH=${OUT_DIR}/modules O=${OUT_DIR} CC=clang LLVM=1 LLVM_IAS=1
        cd ..

    - name: Check compiled kernel image
      run: |
        echo "=== Build output check ==="
        ls -la out/arch/arm64/boot/
        if [ -f out/arch/arm64/boot/Image ]; then
          echo "✅ Kernel Image built successfully : $(ls -lh out/arch/arm64/boot/Image)"
        else
          echo "❌ Kernel Image not found, compile failed"
          exit 1
        fi
        ls out/arch/arm64/boot/dts/vendor/qcom/kona*.dtb 2>/dev/null && echo "✅ DTB files exist" || echo "⚠️ No DTB files (use stock dtbo)"

    - name: Package kernel with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git anykernel
        cp out/arch/arm64/boot/Image anykernel/
        cp out/arch/arm64/boot/dts/vendor/qcom/kona*.dtb anykernel/ 2>/dev/null || true
        
        mkdir -p anykernel/modules
        find out/modules -name "*.ko" -exec cp {} anykernel/modules/ \; 2>/dev/null || true

        cd anykernel
        sed -i 's|kernel.string=.*|kernel.string=TB371FC-SukiSU-EROFS|' anykernel.sh
        sed -i 's|do.devicecheck=1|do.devicecheck=0|' anykernel.sh
        zip -r9 ../TB371FC_kernel.zip .
        cd ..
        ls -lh TB371FC_kernel.zip

    - name: Upload kernel zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: TB371FC_SukiSU_EROFS_Kernel
        path: TB371FC_kernel.zip
        retention-days: 90
